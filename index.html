    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow-x: hidden; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff4f7; background-color: #11172f; background-image: radial-gradient(1px 1px at 8% 18%, #fff 98%, transparent), radial-gradient(1px 1px at 21% 73%, #ffdce5 98%, transparent), radial-gradient(1px 1px at 37% 32%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 57% 13%, #fff 98%, transparent), radial-gradient(1px 1px at 71% 66%, #fff 98%, transparent), radial-gradient(1px 1px at 89% 27%, #ffe7ed 98%, transparent), radial-gradient(1px 1px at 92% 82%, #fff 98%, transparent), linear-gradient(160deg, #090d1d, #202e59 75%, #263c71); background-size: 240px 220px, 310px 290px, 270px 260px, 330px 300px, 280px 270px, 320px 240px, 250px 280px, cover; }

    #home { display: grid; }

    .screen:target ~ #home { display: none; }
    h1 { max-width: 620px; margin: 0; font-size: clamp(2.2rem, 8vw, 4.4rem); line-height: 1.08; letter-spacing: -.04em; text-shadow: 0 3px 28px rgba(255, 48, 91, .36); }
    p { max-width: 520px; margin: 0; color: #e7e6f1; font-size: clamp(1.05rem, 3.5vw, 1.3rem); line-height: 1.55; }
    .tiny-heart { color: #ff3159; font-size: 2.3rem; filter: drop-shadow(0 0 15px rgba(255,49,89,.75)); }
    .choices { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px; margin-top: 12px; }
    .button { display: inline-block; min-width: 118px; padding: 14px 25px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; color: white; background: #ff3159; text-decoration: none; font-size: 1.05rem; font-weight: 750; box-shadow: 0 0 24px rgba(255,49,89,.34); transition: scale .2s ease, background .18s ease; }
    .button:hover { background: #ff5273; }
    .button.no { color: #f0eaf1; background: rgba(255,255,255,.09); box-shadow: none; }
    #q1 .button:not(.no) { scale: 1.08; }
    #q2 .button:not(.no) { scale: 1.28; }
    #q3 .button:not(.no) { scale: 1.48; }
    #q4 .button:not(.no) { scale: 1.70; }
    #q5 .button:not(.no) { scale: 1.92; }
    .big-heart { color: #ff2855; font-size: clamp(9rem, 37vw, 19rem); line-height: .9; filter: drop-shadow(0 0 22px rgba(255,25,75,.8)) drop-shadow(0 0 70px rgba(255,25,75,.56)); animation: heartbeat 1.1s ease-in-out infinite alternate; }
    @keyframes heartbeat { from { transform: scale(.96); } to { transform: scale(1.07); } }
    @media (prefers-reduced-motion: reduce) { .big-heart { animation: none; } .button { transition: none; } }
  </style>
